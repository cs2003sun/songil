  parseSeq++; // 기다리던 /parse 결과는 버림
  const targets = obj.targets && obj.targets.length ? obj.targets : [obj.en];
  voice.clearGroups(["align", "correction", "lost", "hand", "grasp", "search", "found", "server"]);
  app.task = newTask({ ko: obj.ko, targets });
  cfg.targets = targets;        // 서버에는 영어 이름으로 요청 (여러 개면 쉼표로 이어짐)
  cfgVersion++;
  resetObjectState();
  enterSearch(`새 탐색: ${obj.ko} → ${targets.join(",")}`);
  if (message) reply(message, false);
  else reply(`${eulReul(obj.ko)} 찾을게요. 폰을 천천히 돌려주세요`);
}

// "어디": 현재 방향·거리 다시 안내
function speakWhere() {
  const t = app.task;
  if (!t || app.state === S.IDLE || app.state === S.BOOT) {
    reply("지금 찾는 물건이 없어요. 말하기 버튼을 누르고 찾을 물건을 말씀해 주세요");
    return;
  }
  if (app.state === S.DONE) { reply(`${eulReul(t.ko)} 잡았어요`); return; }
  if (app.state === S.SEARCH) { reply(`아직 ${eulReul(t.ko)} 찾는 중이에요. 폰을 천천히 돌려주세요`); return; }
  const tg = lastResult.target;
  if (!tg) {
    if (app.state === S.GUIDE && app.st.occluded) { reply("손 바로 앞에 있어요"); return; }
    const side = t.lastCenter && t.lastCenter.x < 0.5 ? "왼쪽" : "오른쪽";
    reply(`지금은 화면에 보이지 않아요. 마지막으로 ${side}에서 보였어요`);
    return;
  }
  let text = `${horizontalPhrase(tg.center.x)} ${distancePhrase(tg.box.w)}`;
  if (app.state === S.GUIDE && app.st.guide) {
    if (app.st.guide.inside) text += ". 손 바로 앞이에요";
    else if (app.st.guide.dir) text += `. 손은 ${app.st.guide.dir} 옮기세요`;
  }
  reply(text);
}

// "어떻게 잡아", "손잡이": grasp 문장 다시 말하기
// fromUser: 사용자가 물어본 경우 (정보가 없으면 이유를 말함)
function speakGrasp(fromUser) {
  const t = app.task;
  if (!t) {
    if (fromUser) reply("지금 찾는 물건이 없어요. 찾을 물건을 먼저 말씀해 주세요");
    return;
  }
  const d = t.describe;
  if (d.grasp) {
    t.graspPending = false;
    t.graspRequested = false;
    voice.speak(d.grasp, PRIORITY.GUIDE, { group: "grasp", keep: true, interrupt: fromUser });
    return;
  }
  if (!fromUser) { t.graspPending = true; return; }
  if (d.state === "inflight") {
    t.graspRequested = true;
    reply("잡는 방법을 알아보는 중이에요. 알게 되면 바로 말씀드릴게요");
  } else if (d.state === "idle" && lastResult.target && detectionActive()) {
    t.graspRequested = true;
    requestDescribe();
    reply("잡는 방법을 알아보는 중이에요. 알게 되면 바로 말씀드릴게요");
  } else if (d.state === "idle") {
    reply("물건이 화면에 보이면 잡는 방법을 알려 드릴게요");
  } else {
    reply("잡는 방법 정보를 받지 못했어요");
  }
}

// ---------------------------------------------------------------------
// 안내 문장 도우미
// ---------------------------------------------------------------------
function horizontalPhrase(cx) {
  const off = cx - 0.5;
  if (Math.abs(off) <= C.centerTolerance) return "정면에 있어요.";
  return off < 0 ? "왼쪽에 있어요." : "오른쪽에 있어요.";
}

// 거리 구간 (정확한 미터는 말하지 않음)
function distancePhrase(boxW) {
  if (boxW >= C.distNearRatio) return "팔 닿는 거리예요";
  if (boxW >= C.distMidRatio) return "한두 걸음 앞이에요";
  return "조금 멀리 있어요";
}

// 같은 방향이 일정 시간 유지될 때만, 최소 간격·반복 제한을 지켜서 말함
function makeCorrector() {
  return {
    cand: null, candSince: 0,
    lastAt: -Infinity, lastText: "", lastTextAt: -Infinity,
    reset() { this.cand = null; },
    mark(now) { this.lastAt = now; }, // 다른 안내를 말한 것도 간격에 포함
    update(dir, now, say) {
      if (dir !== this.cand) { this.cand = dir; this.candSince = now; }
      if (!dir) return;
      if (now - this.candSince < C.correctionStableMs) return;   // 경계에서 왔다 갔다 방지
      if (now - this.lastAt < C.correctionGapMs) return;         // 음성 교정 사이 최소 간격
      if (dir === this.lastText && now - this.lastTextAt < C.sameRepeatMs) return; // 같은 말 반복 제한
      this.lastAt = now;
      this.lastText = dir;
      this.lastTextAt = now;
      say(dir);
    },
  };
}

// 지수 이동 평균 (떨림 줄이기)
function ema(prev, cur, a) {
  if (!prev) return { x: cur.x, y: cur.y };
  return { x: prev.x + a * (cur.x - prev.x), y: prev.y + a * (cur.y - prev.y) };
}

function inBox(p, box, pad) {
  const px = box.w * pad;
  const py = box.h * pad;
  return p.x >= box.x - px && p.x <= box.x + box.w + px && p.y >= box.y - py && p.y <= box.y + box.h + py;
}

// 비프 간격: r이 0.4 이상이면 800ms, 0.05 이하면 100ms, 그 사이는 비례
function beepInterval(r) {
  if (r >= C.beepFarDist) return C.beepFarMs;
  if (r <= C.beepNearDist) return C.beepNearMs;
  const k = (r - C.beepNearDist) / (C.beepFarDist - C.beepNearDist);
  return Math.round(C.beepNearMs + k * (C.beepFarMs - C.beepNearMs));
}

// 목표 지점: grasp_point가 있고 confidence가 high면 그 점, 아니면 박스 중심
function targetPoint(box, t) {
  const d = t.describe;
  if (d.gpRel && d.gpConfident) return { x: box.x + d.gpRel.u * box.w, y: box.y + d.gpRel.v * box.h };
  return { x: box.x + box.w / 2, y: box.y + box.h / 2 };
}

function missingMs(now) {
  const t = app.task;
  return t && t.missingSince !== null ? now - t.missingSince : 0;
}

// 발견·손 안내 중 물체를 놓쳤을 때. 탐색으로 돌아가면 true
function checkLost(now, occluded) {
  const t = app.task;
  const st = app.st;
  if (lastResult.target) { st.lostSaidAt = -Infinity; return false; }
  // 손에 가려진 경우는 놓친 것으로 세지 않음
  if (occluded) { if (t.missingSince !== null) t.missingSince = now; return false; }
  const miss = missingMs(now);
  if (miss >= C.lostResearchMs) {
    enterSearch("10초 이상 안 보임", true);
    return true;
  }
  if (miss >= C.lostTurnMs && now - (st.lostSaidAt ?? -Infinity) >= C.lostTurnRepeatMs) {
    st.lostSaidAt = now;
    // 마지막으로 보인 쪽으로 폰을 돌리게 안내
    const side = t.lastCenter && t.lastCenter.x < 0.5 ? "왼쪽" : "오른쪽";
    voice.speak(`폰을 천천히 ${side}으로 돌려주세요`, PRIORITY.GUIDE, { group: "lost" });
    if (st.corrector) st.corrector.mark(now);
  }
  return false;
}

// ---------------------------------------------------------------------
// 2. 탐색
// ---------------------------------------------------------------------
function enterSearch(reason, lost = false) {
  setState(S.SEARCH, reason);
  const now = performance.now();
  app.st = { since: now, lastTickAt: now, hintSaid: false };
  const t = app.task;
  t.hitStreak = 0;
  t.missingSince = null;
  if (lost) {
    voice.clearGroups(["align", "correction", "lost", "hand", "found"]);
    voice.speak("물건을 놓쳤어요. 폰을 천천히 돌려주세요", PRIORITY.GUIDE, { group: "search", interrupt: true });
  }
}

function tickSearch(now) {
  const st = app.st;
  const t = app.task;
  const elapsed = now - st.since;

  // 찾는 동안은 조용히: 5초마다 짧은 효과음, 5초에 한 번 안내, 30초면 포기
  if (elapsed >= C.searchTimeoutMs) {
    voice.speak("주변에서 찾지 못했어요", PRIORITY.GUIDE, { group: "search", interrupt: true });
    app.task = null;
    pauseDetection();
    setState(S.IDLE, `${Math.round(C.searchTimeoutMs / 1000)}초 동안 못 찾음`);
    return;
  }
  if (!st.hintSaid && elapsed >= C.searchHintMs) {
    st.hintSaid = true;
    st.lastTickAt = now;
    voice.speak("아직 못 찾았어요. 계속 천천히 돌려주세요", PRIORITY.GUIDE, { group: "search" });
  } else if (now - st.lastTickAt >= C.searchTickMs) {
    st.lastTickAt = now;
    if (!voice.isListening()) sound.searching();
  }

  // 발견 판정: 신뢰도가 높으면 한 번, 아니면 연속으로 잡혀야 함
  const tg = lastResult.target;
  if (tg && (tg.score >= C.foundScoreOnce || t.hitStreak >= C.foundStreak)) enterFound(now);
}

// ---------------------------------------------------------------------
// 3. 발견: 화면 가운데로 맞추기
// ---------------------------------------------------------------------
function enterFound(now) {
  setState(S.FOUND, `${pct(lastResult.target.score)}로 인식`);
  const st = app.st;
  st.corrector = makeCorrector();
  st.corrector.mark(now);
  st.centered = false;
  st.centerSince = null;
  st.handSince = null;
  st.lostSaidAt = -Infinity;
  vibrate(200);
  voice.clearGroups(["search", "lost"]);
  voice.speak("멈추세요", PRIORITY.GUIDE, { group: "found", interrupt: true });
}

function tickFound(now, hand) {
  const st = app.st;
  // 손이 화면에 들어오면 손 안내 단계로
  if (hand) {
    if (st.handSince === null) st.handSince = now;
    if (now - st.handSince >= C.handEnterMs) { enterGuide(now); return; }
  } else {
    st.handSince = null;
  }

  if (checkLost(now, false)) return;
  const tg = lastResult.target;
  if (!tg) return;

  if (st.centered) maybeRetryDescribe(now); // 정면을 맞춘 뒤 아직 설명 요청을 못 했으면 다시 시도
  const off = tg.center.x - 0.5;
  if (!st.centered) {
    if (Math.abs(off) <= C.centerTolerance) {
      st.corrector.update(null, now, () => {});
      if (st.centerSince === null) st.centerSince = now;
      if (now - st.centerSince >= C.centerHoldMs) {
        st.centered = true;
        voice.clearGroups(["align"]);
        const near = tg.box.w >= C.distNearRatio;
        voice.speak(`정면에 있어요. ${distancePhrase(tg.box.w)}${near ? ". 손을 천천히 뻗어 보세요" : ""}`, PRIORITY.GUIDE, { group: "align" });
        st.corrector.mark(now);
        // 가운데에 온 순간 /describe를 백그라운드로 한 번 호출
        requestDescribe();
      }
    } else {
      st.centerSince = null;
      // 물체가 왼쪽에 있으면 폰을 왼쪽으로
      const dir = off < 0 ? "조금 왼쪽으로" : "조금 오른쪽으로";
      st.corrector.update(dir, now, (text) => voice.speak(text, PRIORITY.GUIDE, { group: "align", ttl: C.correctionTtlMs }));
    }
  } else if (Math.abs(off) > C.centerRelease) {
    // 가운데에서 많이 벗어나면 다시 좌우 안내
    st.centered = false;
    st.centerSince = null;
  }
}

// ---------------------------------------------------------------------
// 4. 손 안내
// ---------------------------------------------------------------------
function enterGuide(now) {
  setState(S.GUIDE, "손이 화면에 들어옴");
  const st = app.st;
  st.corrector = makeCorrector();
  st.corrector.mark(now);
  st.hand = null;            // 검지 끝 (지수 이동 평균)
  st.target = null;          // 목표 지점 (지수 이동 평균)
  st.box = app.task.lastBox; // 목표 범위·잡기 판정에 쓰는 박스 (가려지면 마지막 박스 유지)
  st.handSeenAt = now;
  st.handLostSaid = false;
  st.inTarget = false;
  st.lastBeepAt = -Infinity;
  st.graspSince = null;
  st.lostSaidAt = -Infinity;
  st.occluded = false;
  st.guide = null;
  voice.clearGroups(["align", "found"]);
  if (app.task.describe.state === "idle") requestDescribe();
  // 시작할 때 grasp 문장 한 번 (아직 응답 전이면 응답이 오는 대로)
  speakGrasp(false);
}

function tickGuide(now, hand) {
  const t = app.task;
  const st = app.st;

  // ---- 손 위치: 검지 끝 ----
  if (hand) {
    if (!st.hand) st.corrector.reset();
    st.handSeenAt = now;
    st.handLostSaid = false;
    st.hand = ema(st.hand, hand.indexTip, C.emaAlpha);
  } else if (st.hand && now - st.handSeenAt >= C.handLostMs) {
    // 손을 1초 이상 놓침: 비프 멈추고 알림
    st.hand = null;
    st.inTarget = false;
    st.graspSince = null;
    if (!st.handLostSaid) {
      st.handLostSaid = true;
      voice.clearGroups(["correction"]);
      voice.speak("손이 화면에서 벗어났어요", PRIORITY.GUIDE, { group: "hand" });
      st.corrector.mark(now);
    }
  }

  // ---- 목표 지점 ----
  const tg = lastResult.target;
  if (tg) {
    st.box = tg.box;
    st.target = ema(st.target, targetPoint(tg.box, t), C.emaAlpha);
  } else if (!st.target && st.box) {
    st.target = targetPoint(st.box, t);
  }
  // 손이 목표에 가까운데 물체가 안 보이면 손에 가려진 것: 마지막 목표 위치 유지
  st.occluded = !tg && Boolean(st.hand && st.target) && Math.hypot(st.target.x - st.hand.x, st.target.y - st.hand.y) <= C.occludeDist;
  if (checkLost(now, st.occluded)) return;
  const lost = !tg && !st.occluded && missingMs(now) >= C.lostTurnMs;

  if (!st.hand || !st.target || lost || voice.isListening()) {
    st.guide = null;
    return; // 비프 없음
  }

  // ---- 차이 벡터 ----
  const dx = st.target.x - st.hand.x;
  const dy = st.target.y - st.hand.y;
  const r = Math.hypot(dx, dy);
  const tip = hand ? hand.indexTip : st.hand;
  const tipInBox = Boolean(st.box) && inBox(tip, st.box, 0);
  const inside = tipInBox || r <= (st.inTarget ? C.targetExitRadius : C.targetRadius);

  // 목표 범위에 들어옴: 높은 음 한 번 + 진동, 처음이면 "거기예요. 잡으세요"
  if (inside && !st.inTarget) {
    sound.hit();
    vibrate(80);
    if (!t.reachedSaid) {
      t.reachedSaid = true;
      voice.clearGroups(["correction"]);
      voice.speak("거기예요. 잡으세요", PRIORITY.GUIDE, { group: "correction" });
      st.corrector.mark(now);
    }
  }
  st.inTarget = inside;

  // ---- 비프음: 가까울수록 빠르게, 옮겨야 할 쪽에서 소리 ----
  const interval = beepInterval(r);
  const pan = clamp(dx / C.panRange, -1, 1);
  if (!inside && now - st.lastBeepAt >= interval) {
    sound.beep(pan);
    st.lastBeepAt = now;
  }

  // ---- 음성 교정: |dx|, |dy| 중 큰 쪽 ----
  let dir = null;
  if (!inside) {
    const ax = Math.abs(dx);
    const ay = Math.abs(dy);
    if (Math.max(ax, ay) > C.correctionMin) {
      if (ax >= ay) dir = dx > 0 ? "오른쪽으로" : "왼쪽으로";
      else dir = dy < 0 ? "앞으로" : "몸 쪽으로";
    }
  }
  st.corrector.update(dir, now, (text) => voice.speak(text, PRIORITY.GUIDE, { group: "correction", ttl: C.correctionTtlMs }));
  st.guide = { dx, dy, r, dir, inside, interval: inside ? 0 : interval, pan };

  // ---- 잡기 성공: 엄지 끝·검지 끝이 모두 (사방 10% 넓힌) 박스 안에 1초 이상 ----
  if (hand && st.box) {
    const ok = inBox(hand.indexTip, st.box, C.graspBoxPad) && inBox(hand.thumbTip, st.box, C.graspBoxPad);
    if (ok) {
      if (st.graspSince === null) st.graspSince = now;
      if (now - st.graspSince >= C.graspHoldMs) { enterDone(); return; }
    } else {
      st.graspSince = null;
    }
  }

  maybeRetryDescribe(now);
}

// ---------------------------------------------------------------------
// 5. 완료
// ---------------------------------------------------------------------
function enterDone() {
  setState(S.DONE, "잡기 성공");
  app.st = { handGoneSince: null };
  pauseDetection(); // 손이 화면에서 사라질 때까지 인식 일시정지
  voice.clearGroups(["align", "correction", "lost", "hand", "grasp", "found", "search"]);
  sound.success();
  vibrate([80, 60, 80]);
  voice.speak("잡았어요", PRIORITY.GUIDE, { interrupt: true });
  const t = app.task;
  if (t.describe.comment) voice.speak(t.describe.comment, PRIORITY.INFO, { group: "comment" });
  else if (t.describe.state === "inflight" || t.describe.state === "idle") t.commentPending = true;
}

function tickDone(now, hand) {
  const st = app.st;
  if (hand) { st.handGoneSince = null; return; }
  if (st.handGoneSince === null) st.handGoneSince = now;
  if (now - st.handGoneSince >= C.doneHandGoneMs) setState(S.IDLE, "손이 화면에서 사라짐");
}

// =====================================================================
// VLM 설명 요청 (POST /describe) - 발견 후 백그라운드로 한 번
// =====================================================================
function maybeRetryDescribe(now) {
  const d = app.task && app.task.describe;
  if (d && d.state === "idle" && d.tries < DESCRIBE_MAX_TRIES && now >= d.retryAt) requestDescribe();
}

async function requestDescribe() {
  const t = app.task;
  if (!t || t.describe.state !== "idle") return;
  const d = t.describe;
  if (!cfg.server) { d.state = "unavailable"; return; }
  const tg = lastResult.target;
  if (!tg) return; // 물체가 보일 때 다시 시도

  // 박스를 사방 20% 넓혀서 자르기
  const video = els.video;
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const b = tg.box;
  const x0 = clamp01(b.x - b.w * DESCRIBE_PAD);
  const y0 = clamp01(b.y - b.h * DESCRIBE_PAD);
  const x1 = clamp01(b.x + b.w * (1 + DESCRIBE_PAD));
  const y1 = clamp01(b.y + b.h * (1 + DESCRIBE_PAD));
  const sw = (x1 - x0) * vw;
  const sh = (y1 - y0) * vh;
  if (!vw || sw < 4 || sh < 4) return;
  const scale = Math.min(1, DESCRIBE_MAX_SIDE / Math.max(sw, sh));
  const cw = Math.max(1, Math.round(sw * scale));
  const ch = Math.max(1, Math.round(sh * scale));
  const crop = { x0, y0, x1, y1, w: cw, h: ch };
  const boxAtCapture = { ...b };

  d.state = "inflight";
  d.tries++;
  const t0 = performance.now();
  try {
    const { blob } = await encodeJpeg(
      cw, ch,
      (c) => c.drawImage(video, x0 * vw, y0 * vh, sw, sh, 0, 0, cw, ch),
      DESCRIBE_JPEG_QUALITY
    );
    const fd = new FormData();
    fd.append("image", blob, "crop.jpg");
    const { res, body, text } = await postForm(`${cfg.server}/describe`, fd, DESCRIBE_TIMEOUT_MS);
    const elapsed = Math.round(performance.now() - t0);
    if (res.status === 429 || res.status === 503) {
      // 요청 제한·과부하: 잠시 뒤 한 번 더
      d.state = d.tries < DESCRIBE_MAX_TRIES ? "idle" : "failed";
      d.retryAt = performance.now() + DESCRIBE_RETRY_MS;
      throw new Error(`HTTP ${res.status} (${elapsed}ms)`);
    }
    if (!res.ok) throw new Error(`HTTP ${res.status} (${elapsed}ms) ${text.slice(0, 300)}`);
    if (!body) throw new Error(`응답이 JSON이 아닙니다 (${elapsed}ms): ${text.slice(0, 300)}`);
    els.describeOut.textContent = `응답 시간: ${elapsed}ms\n대상: ${t.ko} (${tg.label} ${pct(tg.score)})\n\n${JSON.stringify(body, null, 2)}`;
    if (app.task !== t) return; // 그사이 새 탐색이 시작됐으면 버림
    applyDescribe(t, body, crop, boxAtCapture);
    devLog(els.stateLog, `설명 응답 (${elapsed}ms) safety=${t.describe.safety ? "있음" : "없음"}, grasp_point=${t.describe.gpRel ? (t.describe.gpConfident ? "사용" : "신뢰 낮음") : "없음"}`);
  } catch (err) {
    if (d.state === "inflight") d.state = "failed";
    els.describeOut.textContent = `실패: ${errorText(err)}`;
    console.warn("설명 요청 실패", err);
    setStatus(`설명 요청 실패: ${errorText(err)}`, "warn", "describe");
    if (app.task === t && d.state === "failed") {
      if (t.graspRequested) { t.graspRequested = false; voice.speak("잡는 방법 정보를 받지 못했어요", PRIORITY.INFO); }
      t.graspPending = false;
      t.commentPending = false;
    }
  }
}

function applyDescribe(t, body, crop, box) {
  const d = t.describe;
  // 안전 경고 ("없음" 같은 빈 값은 무시)
  const safety = toSpeech(body.safety);
  d.safety = /^(없음|없어요|없습니다|해당\s*없음|none|null|n\/a|-)?\.?$/i.test(safety) ? "" : safety;
  // 잡는 방법 문장
  const g = body.grasp;
  const grasp = g && typeof g === "object" && !Array.isArray(g) ? (g.text ?? g.description ?? g.sentence ?? "") : g;
  d.grasp = toSpeech(grasp);
  d.comment = toSpeech(body.comment);

  // 잡을 위치: 박스 기준 비율로 저장 → 폰이 조금 움직여도 지금 박스에서 같은 자리를 가리킴
  const gp = parseGraspPoint(body.grasp_point ?? (g && typeof g === "object" ? g.grasp_point : null), crop);
  if (gp && box.w > 0 && box.h > 0) {
    d.gpRel = {
      u: clamp((gp.x - box.x) / box.w, -DESCRIBE_PAD, 1 + DESCRIBE_PAD),
      v: clamp((gp.y - box.y) / box.h, -DESCRIBE_PAD, 1 + DESCRIBE_PAD),
    };
  }
  d.gpConfident = Boolean(d.gpRel) && isHighConfidence(findConfidence(body));
  d.state = "done";

  // 안전 경고는 즉시 (최우선)
  if (d.safety) voice.speak(d.safety, PRIORITY.SAFETY, { group: "safety" });
  // 손 안내 중에 기다리던 grasp, 사용자가 물어본 grasp
  if ((app.state === S.GUIDE && t.graspPending) || t.graspRequested) speakGrasp(false);
  // 완료 후에 기다리던 comment
  if (t.commentPending) {
    t.commentPending = false;
    if (d.comment) voice.speak(d.comment, PRIORITY.INFO, { group: "comment" });
  }
}

// confidence가 어디에 오든 찾음 (grasp_point 안, grasp 안, 최상위)
function findConfidence(body) {
  const gp = body.grasp_point;
  const g = body.grasp;
  const cands = [
    gp && typeof gp === "object" && !Array.isArray(gp) ? gp.confidence : undefined,
    g && typeof g === "object" && !Array.isArray(g) ? g.confidence : undefined,
    body.grasp_point_confidence,
    body.grasp_confidence,
    body.confidence,
  ];
  return cands.find((v) => v !== undefined && v !== null && v !== "");
}

function isHighConfidence(v) {
  if (typeof v === "number") return v >= C.graspConfidenceNum;
  if (typeof v === "string") {
    const s = v.trim().toLowerCase();
    if (s === C.graspConfidenceWord || s === "높음") return true;
    const n = Number(s);
    return Number.isFinite(n) && n >= C.graspConfidenceNum;
  }
  return false;
}

// grasp_point: {x,y} 또는 [x,y]. 0~1이면 잘라낸 이미지 기준 정규화 좌표,
// 1보다 크면 잘라낸 이미지의 픽셀 좌표로 보고 전체 화면 좌표로 바꿈
function parseGraspPoint(gp, crop) {
  if (!gp) return null;
  let x, y;
  if (Array.isArray(gp)) [x, y] = gp;
  else if (typeof gp === "object") ({ x, y } = gp);
  x = Number(x);
  y = Number(y);
  if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
  if (x > 1 || y > 1) { x /= crop.w; y /= crop.h; }
  return {
    x: clamp01(crop.x0 + clamp01(x) * (crop.x1 - crop.x0)),
    y: clamp01(crop.y0 + clamp01(y) * (crop.y1 - crop.y0)),
  };
}

// =====================================================================
// 화면 글자 (큰 상태 한 줄)
// =====================================================================
function renderStateLine(override) {
  let text = override;
  if (!text) {
    const t = app.task;
    const listen = document.body.dataset.listen;
    if (listen && listen !== "off") {
      text = listenText ? `“${listenText}”` : listen === "on" ? "듣는 중… 말씀하세요" : "잠시만요";
    } else {
      switch (app.state) {
        case S.BOOT: text = "준비 중"; break;
        case S.IDLE: text = "말하기를 누르고 물건 이름을 말하세요"; break;
        case S.SEARCH: text = `${t ? t.ko : ""} 찾는 중`; break;
        case S.FOUND: text = `${t ? t.ko : ""} 발견`; break;
        case S.GUIDE: text = `${t ? t.ko : ""} 쪽으로 손 안내 중`; break;
        case S.DONE: text = "잡았어요"; break;
        default: text = "";
      }
    }
  }
  if (els.stateLine.textContent !== text) els.stateLine.textContent = text;
}

// =====================================================================
// 그리기 (관객용: 박스·손·잡을 곳 / #dev: 손→목표 선, r, 방향, 비프 간격)
// =====================================================================
function draw(handLandmarks, now) {
  const W = els.canvas.width;
  const H = els.canvas.height;
  ctx.clearRect(0, 0, W, H);
  const s = W / Math.max(1, els.canvas.clientWidth); // 화면에서 선 두께를 일정하게

  const r = lastResult;

  // 찾는 물체가 아닌 것 (로컬 모드, "다른 물체 보기"일 때만 흐리게)
  if (showOthers) {
    for (const o of r.others) {
      drawBox(o, W, H, s, { color: COLOR_OTHER, alpha: 0.35, width: 1.5, text: `${o.label} ${pct(o.score)}`, weight: 500 });
    }
  }

  // 찾는 물체: 진하게. 신뢰도가 가장 높은 것은 더 두껍게
  const suffix = r.source === "local" ? " (로컬)" : "";
  const koName = app.task ? app.task.ko : "";
  for (const d of r.detections) {
    const isBest = d === r.best;
    drawBox(d, W, H, s, { color: COLOR_TARGET, alpha: isBest ? 1 : 0.8, width: isBest ? 4 : 2.5, text: `${koName || d.label} ${pct(d.score)}${suffix}`, weight: 800 });
  }
  if (r.target) {
    const cx = r.target.center.x * W;
    const cy = r.target.center.y * H;
    ctx.save();
    ctx.strokeStyle = COLOR_TARGET;
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.moveTo(cx - 12 * s, cy); ctx.lineTo(cx + 12 * s, cy);
    ctx.moveTo(cx, cy - 12 * s); ctx.lineTo(cx, cy + 12 * s);
    ctx.stroke();
    ctx.restore();
  }

  // 서버 연결 끊김 표시
  if (cfg.server && srv.mode === "local" && detectionActive()) drawTag("서버 연결 끊김", COLOR_DISCONNECT, W, s);

  // 잡을 곳 (/describe의 grasp_point)
  const t = app.task;
  const box = r.target ? r.target.box : app.state === S.GUIDE ? app.st.box : null;
  if (t && t.describe.gpRel && box && (app.state === S.FOUND || app.state === S.GUIDE)) {
    const gx = (box.x + t.describe.gpRel.u * box.w) * W;
    const gy = (box.y + t.describe.gpRel.v * box.h) * H;
    drawGrasp(gx, gy, s, t.describe.gpConfident);
  }

  // 손 안내 목표 지점과 (#dev) 손→목표 선
  const st = app.st;
  if (app.state === S.GUIDE && st.target) {
    const tx = st.target.x * W;
    const ty = st.target.y * H;
    ctx.save();
    ctx.strokeStyle = COLOR_GUIDE;
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.arc(tx, ty, (st.inTarget ? 22 : 14) * s, 0, Math.PI * 2);
    ctx.stroke();
    if (devMode && st.hand) {
      ctx.setLineDash([10 * s, 8 * s]);
      ctx.beginPath();
      ctx.moveTo(st.hand.x * W, st.hand.y * H);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.setLineDash([]);
      if (st.guide) {
        const g = st.guide;
        const label = `r ${g.r.toFixed(3)}  ${g.inside ? "목표 안" : g.dir || "–"}  ${g.inside ? "비프 없음" : `${g.interval}ms`}`;
        const mx = ((st.hand.x + st.target.x) / 2) * W;
        const my = ((st.hand.y + st.target.y) / 2) * H;
        drawLabel(label, mx, my, s);
      }
    }
    ctx.restore();
  }

  if (handLandmarks) drawHand(handLandmarks, W, H, s);
}

function drawBox(o, W, H, s, style) {
  const x = o.box.x * W;
  const y = o.box.y * H;
  const w = o.box.w * W;
  const h = o.box.h * H;
  ctx.save();
  ctx.globalAlpha = style.alpha;
  ctx.strokeStyle = style.color;
  ctx.lineWidth = style.width * s;
  ctx.strokeRect(x, y, w, h);

  const fontPx = 16 * s;
  ctx.font = `${style.weight} ${fontPx}px system-ui, sans-serif`;
  const pad = 4 * s;
  const tw = ctx.measureText(style.text).width;
  const th = fontPx + pad * 2;
  const ty = y - th >= 0 ? y - th : y;
  ctx.fillStyle = style.color;
  ctx.fillRect(x, ty, tw + pad * 2, th);
  ctx.fillStyle = "#000000";
  ctx.textBaseline = "top";
  ctx.fillText(style.text, x + pad, ty + pad);
  ctx.restore();
}

function drawTag(text, color, W, s) {
  ctx.save();
  const fontPx = 18 * s;
  ctx.font = `800 ${fontPx}px system-ui, sans-serif`;
  const pad = 8 * s;
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = color;
  ctx.fillRect(10 * s, 10 * s, tw + pad * 2, fontPx + pad * 2);
  ctx.fillStyle = "#ffffff";
  ctx.textBaseline = "top";
  ctx.fillText(text, 10 * s + pad, 10 * s + pad);
  ctx.restore();
}

function drawLabel(text, x, y, s) {
  ctx.save();
  const fontPx = 15 * s;
  ctx.font = `700 ${fontPx}px system-ui, sans-serif`;
  const pad = 5 * s;
  const tw = ctx.measureText(text).width;
  const bx = clamp(x - tw / 2 - pad, 0, Math.max(0, els.canvas.width - tw - pad * 2));
  ctx.fillStyle = "rgba(0,0,0,0.78)";
  ctx.fillRect(bx, y - fontPx / 2 - pad, tw + pad * 2, fontPx + pad * 2);
  ctx.fillStyle = "#ffffff";
  ctx.textBaseline = "middle";
  ctx.fillText(text, bx + pad, y);
  ctx.restore();
}

function drawGrasp(x, y, s, confident) {
  ctx.save();
  ctx.globalAlpha = confident ? 1 : 0.55;
  ctx.fillStyle = COLOR_GRASP;
  ctx.beginPath();
  ctx.arc(x, y, 10 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3 * s;
  ctx.beginPath();
  ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.font = `800 ${15 * s}px system-ui, sans-serif`;
  ctx.fillStyle = COLOR_GRASP;
  ctx.textBaseline = "middle";
  ctx.fillText(confident ? "잡을 곳" : "잡을 곳(낮은 확신)", x + 22 * s, y);
  ctx.restore();
}

function drawHand(lm, W, H, s) {
  ctx.save();
  ctx.strokeStyle = COLOR_HAND_LINE;
  ctx.lineWidth = 3 * s;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (const [a, b] of HAND_CONNECTIONS) {
    ctx.moveTo(lm[a].x * W, lm[a].y * H);
    ctx.lineTo(lm[b].x * W, lm[b].y * H);
  }
  ctx.stroke();

  ctx.fillStyle = COLOR_HAND_POINT;
  ctx.lineWidth = 1.5 * s;
  for (let i = 0; i < lm.length; i++) {
    if (i === 8) continue;
    ctx.beginPath();
    ctx.arc(lm[i].x * W, lm[i].y * H, 4 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // 검지 끝 강조 (손 위치)
  const ix = lm[8].x * W;
  const iy = lm[8].y * H;
  ctx.fillStyle = COLOR_INDEX_TIP;
  ctx.beginPath();
  ctx.arc(ix, iy, 11 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3 * s;
  ctx.beginPath();
  ctx.arc(ix, iy, 17 * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// =====================================================================
// #dev 화면 갱신
// =====================================================================
function updateDebug(detection, now) {
  if (!devMode || now - lastDebugUpdate < 200) return;
  lastDebugUpdate = now;
  els.output.textContent = JSON.stringify(
    detection,
    (k, v) => (typeof v === "number" ? Math.round(v * 1000) / 1000 : v),
    2
  );
  const t = app.task;
  const st = app.st;
  const lines = [
    `상태: ${STATE_LABEL[app.state]} (${((now - app.enteredAt) / 1000).toFixed(1)}초)`,
    `찾는 물건: ${t ? `${t.ko} → ${t.en}` : "없음"}${defaultTarget ? ` / 기본: ${defaultTarget.ko}` : ""}`,
  ];
  if (t) {
    const d = t.describe;
    lines.push(`설명: ${d.state}${d.gpRel ? `, grasp_point ${d.gpConfident ? "사용" : "신뢰 낮음(박스 중심 사용)"}` : ""}${d.safety ? ", safety 있음" : ""}`);
    lines.push(`안 보인 시간: ${lastResult.target ? "보임" : `${(missingMs(now) / 1000).toFixed(1)}초`}`);
  }
  if (app.state === S.GUIDE) {
    const g = st.guide;
    lines.push(`손: ${st.hand ? `${st.hand.x.toFixed(2)}, ${st.hand.y.toFixed(2)}` : "없음"}  목표: ${st.target ? `${st.target.x.toFixed(2)}, ${st.target.y.toFixed(2)}` : "없음"}${st.occluded ? " (손에 가려짐)" : ""}`);
    if (g) {
      lines.push(`dx ${g.dx.toFixed(3)}  dy ${g.dy.toFixed(3)}  r ${g.r.toFixed(3)}`);
      lines.push(`안내 방향: ${g.inside ? "목표 범위 안" : g.dir || "– (0.08 이하)"}`);
      lines.push(`비프 간격: ${g.inside ? "없음" : `${g.interval}ms`}  pan ${g.pan.toFixed(2)}`);
    } else {
      lines.push("비프: 멈춤");
    }
    lines.push(`잡기 판정: ${st.graspSince !== null ? `${((now - st.graspSince) / 1000).toFixed(1)}초` : "–"}`);
  }
  lines.push(`음성: ${voice.isListening() ? "듣는 중" : voice.isSpeaking() ? "말하는 중" : "조용"} (대기열 ${voice.queueLength()})`);
  els.guideInfo.textContent = lines.join("\n");
}

// =====================================================================
// QR 코드 (#dev: 발표 화면에서 관객 접속용)
// =====================================================================
// QR 주소에는 key와 target만 넣음 (server·dev는 넣지 않음)
// mask=true 이면 화면 표시용으로 키를 가림
function buildShareUrl(mask = false) {
  const base = location.href.split("#")[0];
  const p = new URLSearchParams();
  if (cfg.key) p.set("key", mask ? "KEY" : cfg.key);
  const target = els.targetInput.value.trim();
  if (target) p.set("target", target);
  const url = `${base}#${p.toString()}`;
  return mask ? url.replace("key=KEY", "key=••••") : url;
}

function showQr() {
  readConfig();
  if (typeof window.QRious !== "function") {
    showError("QR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.");
    return;
  }
  const url = buildShareUrl();

  // 관객 폰에서 열 수 없는 주소면 경고
  const warns = [];
  if (location.protocol !== "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    warns.push("지금 페이지 주소는 관객 폰에서 열 수 없습니다. HTTPS로 배포한 주소에서 QR을 띄워 주세요.");
  }
  if (!cfg.key) warns.push("API 키가 비어 있습니다. 주소 # 뒤에 key 값을 넣어 주세요.");
  // QR에는 서버 주소가 들어가지 않으므로, 관객은 이 페이지와 같은 주소의 서버를 씀
  if (cfg.server && cfg.server !== location.origin) {
    warns.push(`QR로 접속한 관객은 ${location.origin} 서버를 사용합니다. 지금 입력한 서버 주소(${cfg.server})와 다릅니다.`);
  }
  els.qrWarn.textContent = warns.join(" ");
  els.qrWarn.hidden = warns.length === 0;

  els.qrModal.hidden = false;
  const cssSize = Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.75);
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  new window.QRious({
    element: els.qrCanvas,
    value: url,
    size: Math.round(cssSize * dpr),
    level: "M",
    background: "#ffffff",
    foreground: "#000000",
  });
  els.qrCanvas.style.width = `${cssSize}px`;
  els.qrCanvas.style.height = `${cssSize}px`;
  // 화면에는 키를 가려서 표시
  els.qrUrl.textContent = buildShareUrl(true);
  els.qrCloseBtn.focus();
}

function hideQr() {
  els.qrModal.hidden = true;
  els.qrBtn.focus();
}

// =====================================================================
// 버튼·입력 이벤트
// =====================================================================
els.startBtn.addEventListener("click", start);

// 말하기: TalkBack은 두 번 탭, 일반 사용자는 한 번 탭 → 둘 다 click 하나로 들어옴
els.talkBtn.addEventListener("click", () => {
  sound.unlock();
  voice.listen();
});

// 그만: 모든 안내 중지, 대기로
els.stopBtn.addEventListener("click", () => {
  sound.unlock();
  if (!running) { voice.stopAll(); return; }
  stopGuidance("그만 버튼");
});

voice.onIntent(handleIntent);

// #dev 입력
els.findBtn.addEventListener("click", () => {
  updateDefaultTarget();
  if (!running) { setStatus("먼저 시작 버튼을 누르세요", "warn"); return; }
  const v = els.targetInput.value.trim();
  if (!defaultTarget) { if (v) handleIntent({ type: "find", text: `${v} 찾아줘`, name: v, object: null, empty: false }); return; }
  startTask(defaultTarget);
});
els.cmdBtn.addEventListener("click", () => {
  const text = els.cmdInput.value.trim();
  if (text) voice.simulate(text);
});
els.cmdInput.addEventListener("keydown", (e) => { if (e.key === "Enter") els.cmdBtn.click(); });
els.targetInput.addEventListener("change", updateDefaultTarget);
for (const input of [els.serverInput, els.keyInput]) input.addEventListener("change", readConfig);
els.sizeSelect.addEventListener("change", () => {
  srv.slowCount = 0; // 직접 고르면 느림 횟수 초기화
  readConfig();
});
els.qrBtn.addEventListener("click", showQr);
els.qrCloseBtn.addEventListener("click", hideQr);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !els.qrModal.hidden) hideQr(); });
els.othersBtn.addEventListener("click", () => {
  showOthers = !showOthers;
  els.othersBtn.setAttribute("aria-pressed", String(showOthers));
  els.othersBtn.textContent = showOthers ? "찾는 물체만" : "다른 물체 보기";
});
window.addEventListener("hashchange", applyHash);

// 화면 확대·길게 눌러 메뉴 막기 (#dev 입력칸 제외)
document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
document.addEventListener("contextmenu", (e) => { if (!e.target.closest(".dev-panel")) e.preventDefault(); });
document.addEventListener("touchmove", (e) => {
  if (e.touches.length > 1 || !e.target.closest(".dev-panel, .modal")) e.preventDefault();
}, { passive: false });

// =====================================================================
// 초기화: 설정 읽기 → 브라우저 확인 → 모델 미리 불러오기
// =====================================================================
initEncoder();
applyHash();
checkBrowser();
renderStats();
renderStateLine();
ensureModels().catch((err) => {
  // 시작 버튼을 누르면 다시 시도함
  console.warn("모델 미리 불러오기 실패", err);
});
</script>
